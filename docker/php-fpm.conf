[www]
; Override pool settings from the original configuration
listen = /var/run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 65535

; User/group to run PHP-FPM as
user = www-data
group = www-data

; Process manager settings
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.process_idle_timeout = 10s
pm.status_path = /status

; Logging
catch_workers_output = yes
php_flag[display_errors] = off
php_flag[log_errors] = on
php_value[error_log] = /var/log/php/error.log

; Security
php_flag[disable_functions] = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifcontinued,pcntl_wifexitstatus,pcntl_wcoredump,pcntl_wstopped,pcntl_wstopsig,pcntl_signal,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigaction,pcntl_sigwait,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority,exec,passthru,shell_exec,system,proc_open,proc_close,popen,pclose,curl_exec,curl_multi_exec,parse_ini_file,show_source

; Performance
php_value[memory_limit] = 256M
php_value[max_execution_time] = 300
php_value[upload_max_filesize] = 50M
php_value[post_max_size] = 50M
