; PHP configuration for Image Mosaic Gallery

; Error handling
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL & ~E_NOTICE

; Performance and limits
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 50M
post_max_size = 50M

; File uploads
file_uploads = On
upload_tmp_dir = /tmp

; Session
session.save_path = /tmp
session.gc_maxlifetime = 1440

; Date/Time
date.timezone = UTC

; Disable unnecessary functions
disable_functions = passthru,shell_exec,system,proc_open,proc_close,popen,pclose,exec,pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifcontinued,pcntl_wifexitstatus,pcntl_wcoredump,pcntl_wstopped,pcntl_wstopsig,pcntl_signal,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigaction,pcntl_sigwait,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority

; URL settings
default_charset = "UTF-8"
