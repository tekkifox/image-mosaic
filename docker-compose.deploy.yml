services:
  image-mosaic:
    image: ghcr.io/tekkifox/travelling-site:latest
    container_name: travelling
    hostname: travelling
    ports:
      - "100.96.175.0:8080:8080"
    networks:
      proxy:
        aliases:
          - travelling-site
    env_file:
      - stack.env
    restart: unless-stopped
networks:
  proxy:
    external: true
