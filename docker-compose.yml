version: '3.8'

services:
  image-mosaic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image-mosaic
    ports:
      - "8080:8080"
    environment:
      # PhotoPrism Configuration
      PHOTO_PRISM_BASE_URL: ${PHOTO_PRISM_BASE_URL:-https://photoprism.example.com}
      PHOTO_PRISM_API_KEY: ${PHOTO_PRISM_API_KEY:-}
      PHOTO_PRISM_ACCESS_TOKEN: ${PHOTO_PRISM_ACCESS_TOKEN:-}
      PHOTO_PRISM_USE_BASIC_AUTH: ${PHOTO_PRISM_USE_BASIC_AUTH:-false}
      PHOTO_PRISM_USERNAME: ${PHOTO_PRISM_USERNAME:-}
      PHOTO_PRISM_PASSWORD: ${PHOTO_PRISM_PASSWORD:-}
      PHOTO_PRISM_OAUTH_CLIENT_ID: ${PHOTO_PRISM_OAUTH_CLIENT_ID:-}
      PHOTO_PRISM_OAUTH_CLIENT_SECRET: ${PHOTO_PRISM_OAUTH_CLIENT_SECRET:-}
    
    volumes:
      - image-mosaic-cache:/app/public/cache
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api.php?action=photo-count"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    networks:
      - image-mosaic-network

volumes:
  image-mosaic-cache:
    driver: local

networks:
  image-mosaic-network:
    driver: bridge
