version: '3.8'

services:
  image-mosaic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image-mosaic
    ports:
      - "8081:8081"
    environment:
      # PhotoPrism Configuration
      PHOTO_PRISM_BASE_URL: ${PHOTO_PRISM_BASE_URL:-https://photoprism.example.com}
      PHOTO_PRISM_ACCESS_TOKEN: ${PHOTO_PRISM_ACCESS_TOKEN:-}
    
    volumes:
      - image-mosaic-cache:/app/public/cache
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api.php?action=photo-count&category=Travelling"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    networks:
      - image-mosaic-network

volumes:
  image-mosaic-cache:
    driver: local

networks:
  image-mosaic-network:
    driver: bridge
