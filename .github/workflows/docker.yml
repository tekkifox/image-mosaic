name: Build and Push to GitHub Container Registry

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy-to-portainer:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Trigger Portainer webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "⚠️  Portainer webhook URL not configured. Skipping deployment."
            echo "See .github/PORTAINER_DEPLOY_SETUP.md for setup instructions."
            exit 0
          fi

          echo "🚀 Triggering Portainer webhook..."
          
          # Trigger the webhook
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$PORTAINER_WEBHOOK_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "Response code: $HTTP_CODE"
          echo "Response body: $BODY"

          if [ "$HTTP_CODE" == "200" ] || [ "$HTTP_CODE" == "202" ]; then
            echo "✅ Webhook triggered successfully - Portainer will redeploy stack"
          else
            echo "⚠️  Webhook returned HTTP $HTTP_CODE"
            echo "Stack may still redeploy - check Portainer for status"
          fi

      - name: Deployment notification
        if: always()
        run: |
          echo "📋 Deployment Status:"
          echo "  ✅ Docker build: Completed"
          echo "  ✅ Image pushed: ghcr.io/${{ github.repository }}:latest"
          echo "  ✅ Portainer webhook: Triggered"
          echo ""
          echo "Next: Go to Portainer → Stacks → image-mosaic → Logs"
