name: Test

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend unit tests
    runs-on: [self-hosted, paseo]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      # Node 26 no longer bundles corepack, and a self-hosted runner has no
      # pre-installed pnpm, so install corepack before enabling the pnpm shim.
      # Pinned to the same version portainer-deploy.yml uses.
      - name: Install corepack
        run: npm i -g corepack@0.36.0

      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run Vitest
        run: corepack pnpm run test:unit

  go:
    name: Go tests
    runs-on: [self-hosted, paseo]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go test
        run: go test ./...

  # Stays on GitHub-hosted: `playwright install --with-deps` apt-installs
  # Chromium's system libraries, which needs root. The fleet runner's tool set
  # (git, curl, jq, docker, node) does not include passwordless sudo.
  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Build and run the smoke test
        run: corepack pnpm run test:e2e
