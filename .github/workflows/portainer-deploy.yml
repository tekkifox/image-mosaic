name: Build & Deploy to Portainer

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  # amd64 image, built natively on the fleet's self-hosted x86 runner.
  build:
    runs-on: [self-hosted, paseo]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      # Node 26 no longer bundles corepack, so install it explicitly. Pinning
      # 0.36.0 from npm also avoids older corepack resolving pnpm through the
      # old bin/pnpm.cjs path, which pnpm 12 no longer ships. 0.36.0 includes
      # the pnpm 11+ native-bin fix (#776) and is the version the sibling
      # rossmoney_me repository pins.
      - name: Enable Corepack
        run: npm i -g corepack@0.36.0 && corepack enable

      - name: Install frontend deps & build
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'

      - name: Go mod download
        run: go mod download

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Push by digest only. The merge job assembles the multi-arch manifest
      # from the two per-architecture digests.
      - name: Build and push amd64 image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Record amd64 digest
        run: |
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "No digest produced by the amd64 build" >&2
            exit 1
          fi
          printf '%s\n' "$digest" > "${RUNNER_TEMP}/digest"

      - name: Upload amd64 digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digest
          if-no-files-found: error
          retention-days: 1

  # arm64 image, built natively on the GitHub-hosted ARM runner. No QEMU, and
  # the fleet's self-hosted runner is x86_64, so this job stays GitHub-hosted.
  build-arm64:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      # Node 26 no longer bundles corepack, so install it explicitly. Pinning
      # 0.36.0 from npm also avoids older corepack resolving pnpm through the
      # old bin/pnpm.cjs path, which pnpm 12 no longer ships. 0.36.0 includes
      # the pnpm 11+ native-bin fix (#776) and is the version the sibling
      # rossmoney_me repository pins.
      - name: Enable Corepack
        run: npm i -g corepack@0.36.0 && corepack enable

      - name: Install frontend deps & build
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'

      - name: Go mod download
        run: go mod download

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push arm64 image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Record arm64 digest
        run: |
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "No digest produced by the arm64 build" >&2
            exit 1
          fi
          printf '%s\n' "$digest" > "${RUNNER_TEMP}/digest"

      - name: Upload arm64 digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-arm64
          path: ${{ runner.temp }}/digest
          if-no-files-found: error
          retention-days: 1

  # Publish the multi-arch manifest from both digests, then trigger the deploy.
  # This is the only place the Portainer webhook fires, and it runs only after
  # the manifest has been pushed. It runs on the self-hosted runner so it can
  # reach the storage hub through its TLS front door (PORTAINER_URL, e.g.
  # https://portainer.example.com).
  merge:
    runs-on: [self-hosted, paseo]
    needs: [build, build-arm64]
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digests/amd64

      - name: Download arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-arm64
          path: ${{ runner.temp }}/digests/arm64

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-arch manifest
        run: |
          amd64="$(cat "${RUNNER_TEMP}/digests/amd64/digest")"
          arm64="$(cat "${RUNNER_TEMP}/digests/arm64/digest")"
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY}:latest" \
            --tag "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}" \
            "ghcr.io/${GITHUB_REPOSITORY}@${amd64}" \
            "ghcr.io/${GITHUB_REPOSITORY}@${arm64}"

      - name: Checkout for deploy compose
        uses: actions/checkout@v7

      - name: Deploy stack to Portainer via API
        if: github.ref == 'refs/heads/main'
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_NAME: photos-travelling-site
        run: |
          set -euo pipefail

          # 0. Guard against image drift. Portainer reports success even when the
          #    stack references a tag this run never published, so fail loudly if
          #    the deploy compose does not point at the image built above.
          published_image="ghcr.io/${GITHUB_REPOSITORY}:latest"
          compose_image=$(sed -n 's/^[[:space:]]*image:[[:space:]]*//p' docker-compose.deploy.yml \
            | head -n 1 | tr -d "[:space:]\"'")
          if [ "$compose_image" != "$published_image" ]; then
            echo "docker-compose.deploy.yml must reference ${published_image}, found '${compose_image:-<none>}'" >&2
            exit 1
          fi

          tmpdir="${RUNNER_TEMP}/portainer"
          mkdir -p "$tmpdir"

          # 1. Resolve the stack by name. Stack ids and endpoint ids are facts
          #    Portainer already knows; pinning them here is what let the deploy
          #    rot when the stack was recreated and moved to another environment.
          stacks_status=$(curl -sS -o "$tmpdir/stacks.json" -w "%{http_code}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks")
          if [ "$stacks_status" -lt 200 ] || [ "$stacks_status" -ge 300 ]; then
            echo "GET /api/stacks failed with status ${stacks_status}" >&2
            cat "$tmpdir/stacks.json" >&2
            exit 1
          fi

          matches=$(jq -c --arg name "$PORTAINER_STACK_NAME" \
            '[.[] | select(.Name == $name)]' "$tmpdir/stacks.json")
          match_count=$(jq 'length' <<<"$matches")
          if [ "$match_count" -eq 0 ]; then
            echo "No Portainer stack named '${PORTAINER_STACK_NAME}' was found." >&2
            echo "Stack names that do exist:" >&2
            jq -r 'if length == 0 then "  <none>" else .[] | "  \(.Name)" end' \
              "$tmpdir/stacks.json" >&2
            exit 1
          fi
          if [ "$match_count" -gt 1 ]; then
            echo "More than one Portainer stack is named '${PORTAINER_STACK_NAME}' (${match_count} matches); refusing to guess which one to deploy." >&2
            echo "Matching stacks:" >&2
            jq -r '.[] | "  Id=\(.Id) EndpointId=\(.EndpointId)"' <<<"$matches" >&2
            exit 1
          fi

          stack_id=$(jq -r '.[0].Id' <<<"$matches")
          endpoint_id=$(jq -r '.[0].EndpointId' <<<"$matches")
          if [ -z "$stack_id" ] || [ "$stack_id" = "null" ] \
            || [ -z "$endpoint_id" ] || [ "$endpoint_id" = "null" ]; then
            echo "Portainer returned no Id/EndpointId for stack '${PORTAINER_STACK_NAME}' (Id='${stack_id}', EndpointId='${endpoint_id}')" >&2
            exit 1
          fi

          # 2. Read the current stack Env array. Sending an empty Env wipes the
          #    variables the running container needs, so this read is mandatory.
          get_request="GET /api/stacks/${stack_id}"
          get_status=$(curl -sS -o "$tmpdir/get.json" -w "%{http_code}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks/${stack_id}")
          if [ "$get_status" -lt 200 ] || [ "$get_status" -ge 300 ]; then
            echo "${get_request} failed with status ${get_status}" >&2
            cat "$tmpdir/get.json" >&2
            exit 1
          fi
          env_json=$(jq -c '.Env // []' "$tmpdir/get.json")

          # 3. Build the deploy body and PUT it.
          jq -n \
            --rawfile compose docker-compose.deploy.yml \
            --argjson env "$env_json" \
            '{StackFileContent: $compose, Env: $env, PullImage: true}' \
            > "$tmpdir/body.json"

          put_request="PUT /api/stacks/${stack_id}?endpointId=${endpoint_id}"
          put_status=$(curl -sS -o "$tmpdir/put.json" -w "%{http_code}" \
            -X PUT \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary "@$tmpdir/body.json" \
            "${PORTAINER_URL}/api/stacks/${stack_id}?endpointId=${endpoint_id}")
          if [ "$put_status" -lt 200 ] || [ "$put_status" -ge 300 ]; then
            echo "${put_request} failed with status ${put_status}" >&2
            cat "$tmpdir/put.json" >&2
            exit 1
          fi
          echo "Portainer deploy succeeded (HTTP $put_status)"
