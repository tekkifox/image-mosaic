name: Build & Deploy to Portainer

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      # Node 26 no longer bundles corepack, so install it explicitly. Pinning
      # 0.36.0 from npm also avoids older corepack resolving pnpm through the
      # old bin/pnpm.cjs path, which pnpm 12 no longer ships. 0.36.0 includes
      # the pnpm 11+ native-bin fix (#776) and is the version the sibling
      # rossmoney_me repository pins.
      - name: Enable Corepack
        run: npm i -g corepack@0.36.0 && corepack enable

      - name: Install frontend deps & build
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'

      - name: Go mod download
        run: go mod download

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Trigger Portainer stack webhook (if configured)
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -n "$PORTAINER_WEBHOOK_URL" ]; then
            echo "Triggering Portainer webhook"
            curl -X POST -fsS -o /dev/null -w "%{http_code}\n" "$PORTAINER_WEBHOOK_URL"
          else
            echo "No PORTAINER_WEBHOOK_URL secret configured. Skipping Portainer trigger."
          fi
