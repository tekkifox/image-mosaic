name: Design tokens

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'

      - name: Check stylesheets for raw values
        run: node scripts/check-tokens.mjs
